name: CI
on:
  push:
    branches: [main, alpha]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - run: npm ci
      - run: npm run check
      - run: python3 tests/debian_sources_test.py
      - run: npm run test:cli
      - run: npm run generate:crds && git diff --exit-code -- charts/paseo/crds
      - run: helm lint charts/paseo && helm template paseo charts/paseo --namespace paseo-system --include-crds > /tmp/paseo.yaml
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag paseo-gateway:ci .
      - run: node scripts/codex-auth-contract.mjs paseo-gateway:ci
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker build --file docker/workspace.Dockerfile --tag paseo-workspace:dev .
      - run: node scripts/codex-auth-contract.mjs paseo-workspace:dev
      - run: npm run test:upstream
      - run: npm run test:provider-probe
  upstream-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require a native ARM64 host
        run: test "$(uname -m)" = aarch64
      - run: npm ci
      - run: docker build --file docker/workspace.Dockerfile --tag paseo-workspace:dev .
      - run: node scripts/codex-auth-contract.mjs paseo-workspace:dev
      - run: npm run test:upstream
      - run: npm run test:provider-probe
