{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paseo-workspace-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workspace
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - {protocol: TCP, port: 6767}
{{- end }}
