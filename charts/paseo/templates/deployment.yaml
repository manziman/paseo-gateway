apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-gateway
  labels:
    app.kubernetes.io/name: paseo-kubernetes
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo-kubernetes
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: paseo-gateway
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "paseo.gatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            - name: GATEWAY_SIGNING_KEY_FILE
              value: /signing/password
            - name: GATEWAY_INTERNAL_URL
              value: "{{ ternary "wss" "ws" .Values.transport.tls.enabled }}://paseo-gateway.{{ .Release.Namespace }}.svc:8080/ws"
            - name: MAX_RUNNING_WORKSPACES
              value: {{ .Values.gateway.maxRunningWorkspaces | quote }}
            - name: WORKSPACE_READY_TIMEOUT_SECONDS
              value: {{ .Values.gateway.workspaceReadyTimeoutSeconds | quote }}
            - name: SCHEDULE_HISTORY_LIMIT
              value: {{ .Values.gateway.scheduleHistoryLimit | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.gateway.nodeOptions | quote }}
            - name: PASEO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKSPACE_IMAGE
              value: {{ include "paseo.workspaceImage" . | quote }}
            - name: WORKSPACE_IMAGE_PULL_POLICY
              value: {{ .Values.workspace.pullPolicy | quote }}
            - name: WORKSPACE_STORAGE_CLASS
              value: {{ .Values.workspace.storageClass | quote }}
            - name: WORKSPACE_STORAGE_ACCESS_MODE
              value: {{ .Values.workspace.storageAccessMode | quote }}
            {{- if .Values.transport.tls.enabled }}
            - name: GATEWAY_TLS_CERT_FILE
              value: /transport/tls.crt
            - name: GATEWAY_TLS_KEY_FILE
              value: /transport/tls.key
            - name: NODE_EXTRA_CA_CERTS
              value: /transport/ca.crt
            - name: WORKSPACE_TLS_SECRET
              value: {{ .Values.transport.tls.workspaceSecret | quote }}
            {{- end }}
            - name: WORKSPACE_STORAGE_SIZE
              value: {{ .Values.workspace.storageSize | quote }}
            - name: GATEWAY_ALLOWED_HOSTS
              value: {{ printf "%s,paseo-gateway,paseo-gateway.%s.svc" .Values.gateway.allowedHosts .Release.Namespace | quote }}
            - name: GATEWAY_PASSWORD_FILE
              value: /identity/password
            - name: GATEWAY_ID_FILE
              value: /identity/serverId
            - name: BACKEND_PASSWORD_FILE
              value: /backend/password
            - name: BACKEND_SECRET_NAME
              value: {{ .Values.gateway.backendSecret | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ ternary "HTTPS" "HTTP" .Values.transport.tls.enabled }}}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: {{ ternary "HTTPS" "HTTP" .Values.transport.tls.enabled }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ ternary "HTTPS" "HTTP" .Values.transport.tls.enabled }}}
            periodSeconds: 10
          volumeMounts:
            {{- if .Values.transport.tls.enabled }}
            - {name: transport, mountPath: /transport, readOnly: true}
            {{- end }}
            - {name: signing, mountPath: /signing, readOnly: true}
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: backend, mountPath: /backend, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if .Values.transport.tls.enabled }}
        - name: transport
          secret:
            secretName: {{ .Values.transport.tls.gatewaySecret }}
            defaultMode: 0440
        {{- end }}
        - name: signing
          secret:
            secretName: {{ .Values.gateway.signingSecret }}
            defaultMode: 0440
        - name: identity
          secret:
            secretName: {{ .Values.gateway.identitySecret }}
            defaultMode: 0440
        - name: backend
          secret:
            secretName: {{ .Values.gateway.backendSecret }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
