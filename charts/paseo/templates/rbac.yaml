apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo-workspace
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-gateway
rules:
  - apiGroups: [paseo-gateway.manziman.github.io]
    resources: [paseoprojects]
    verbs: [get, list]
  - apiGroups: [paseo-gateway.manziman.github.io]
    resources: [paseoworkspaces]
    verbs: [get, list, create, update]
  - apiGroups: [paseo-gateway.manziman.github.io]
    resources: [paseoworkspaces/status]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
  - apiGroups: [paseo-gateway.manziman.github.io]
    resources: [paseocredentialprofiles]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-gateway
subjects:
  - kind: ServiceAccount
    name: paseo-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: paseo-gateway
  apiGroup: rbac.authorization.k8s.io
