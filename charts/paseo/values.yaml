image:
  repository: paseo-gateway
  tag: dev
  pullPolicy: IfNotPresent
workspace:
  image: paseo-workspace:dev
  pullPolicy: IfNotPresent
  storageClass: ""
  storageSize: 5Gi
gateway:
  name: Paseo Gateway
  signingSecret: paseo-signing
  maxRunningWorkspaces: 20
  workspaceReadyTimeoutSeconds: 300
  scheduleHistoryLimit: 50
  nodeOptions: --max-old-space-size=256
  allowedHosts: localhost,127.0.0.1
  identitySecret: paseo-identity
  backendSecret: paseo-backend
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
networkPolicy:
  enabled: true
  egress:
    enabled: false
    rules: []
    # Additional egress per credential profile. Kubernetes policies are additive.
    profiles: []
