image:
  repository: ghcr.io/manziman/paseo-gateway
  # Empty uses Chart.appVersion. Set digest to pin the immutable published image.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
workspace:
  repository: ghcr.io/manziman/paseo-workspace
  tag: ""
  digest: ""
  # Optional complete image reference, retained for local development overrides.
  image: ""
  pullPolicy: IfNotPresent
  storageClass: ""
  storageSize: 5Gi
  # Requires a compatible CSI driver; existing PVCs are never migrated.
  storageAccessMode: ReadWriteOnce
transport:
  tls:
    enabled: false
    # Each retained Secret needs tls.crt, tls.key and ca.crt.
    gatewaySecret: paseo-gateway-tls
    workspaceSecret: paseo-workspace-tls
gateway:
  name: Paseo Gateway
  signingSecret: paseo-signing
  maxRunningWorkspaces: 20
  workspaceReadyTimeoutSeconds: 300
  scheduleHistoryLimit: 50
  nodeOptions: --max-old-space-size=256
  allowedHosts: localhost,127.0.0.1
  identitySecret: paseo-identity
  backendSecret: paseo-backend
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
networkPolicy:
  enabled: true
  egress:
    enabled: false
    rules: []
    # Additional egress per credential profile. Kubernetes policies are additive.
    profiles: []
