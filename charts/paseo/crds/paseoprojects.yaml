{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "paseoprojects.paseo-gateway.manziman.github.io"
  },
  "spec": {
    "group": "paseo-gateway.manziman.github.io",
    "scope": "Namespaced",
    "names": {
      "kind": "PaseoProject",
      "plural": "paseoprojects",
      "singular": "paseoproject"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string",
                "enum": [
                  "paseo-gateway.manziman.github.io/v1alpha1"
                ]
              },
              "kind": {
                "type": "string",
                "enum": [
                  "PaseoProject"
                ]
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "displayName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  },
                  "repository": {
                    "type": "string",
                    "maxLength": 2048,
                    "pattern": "^(https://[^/@:?#\\s]+(:[0-9]+)?/[^?#\\s]+|ssh://git@[^/@:?#\\s]+(:[0-9]+)?/[^?#\\s]+|git@[A-Za-z0-9.-]+:[A-Za-z0-9._/-]+)$"
                  },
                  "revision": {
                    "default": "HEAD",
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._/@{}^~+-]*$"
                  },
                  "credentialProfile": {
                    "type": "string",
                    "maxLength": 63,
                    "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  },
                  "runtime": {
                    "type": "object",
                    "properties": {
                      "image": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 512,
                        "pattern": "^[A-Za-z0-9][A-Za-z0-9._/@:-]*$"
                      },
                      "resources": {
                        "type": "object",
                        "properties": {
                          "requests": {
                            "type": "object",
                            "properties": {
                              "cpu": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              },
                              "memory": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              },
                              "ephemeral-storage": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              }
                            }
                          },
                          "limits": {
                            "type": "object",
                            "properties": {
                              "cpu": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              },
                              "memory": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              },
                              "ephemeral-storage": {
                                "type": "string",
                                "maxLength": 32,
                                "pattern": "^(?:[0-9]+(?:\\.[0-9]+)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+|[EPTGMK]i?|m|k)?$"
                              }
                            }
                          }
                        }
                      }
                    }
                  },
                  "cache": {
                    "type": "object",
                    "properties": {
                      "claimName": {
                        "type": "string",
                        "maxLength": 63,
                        "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                      },
                      "subPath": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 240,
                        "pattern": "^[A-Za-z0-9._/-]+$",
                        "x-kubernetes-validations": [
                          {
                            "rule": "self.split('/').all(p, p != '' && p != '.' && p != '..')",
                            "message": "Path must be relative without empty or traversal components"
                          }
                        ]
                      }
                    },
                    "required": [
                      "claimName"
                    ]
                  },
                  "maxRunningWorkspaces": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 10000
                  }
                },
                "required": [
                  "displayName",
                  "repository",
                  "revision",
                  "credentialProfile"
                ]
              }
            },
            "required": [
              "apiVersion",
              "kind",
              "metadata",
              "spec"
            ]
          }
        }
      }
    ]
  }
}
