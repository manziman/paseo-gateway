{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "paseoworkspaces.paseo-gateway.manziman.github.io"
  },
  "spec": {
    "group": "paseo-gateway.manziman.github.io",
    "scope": "Namespaced",
    "names": {
      "kind": "PaseoWorkspace",
      "plural": "paseoworkspaces",
      "singular": "paseoworkspace"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string",
                "enum": [
                  "paseo-gateway.manziman.github.io/v1alpha1"
                ]
              },
              "kind": {
                "type": "string",
                "enum": [
                  "PaseoWorkspace"
                ]
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "projectRef": {
                    "type": "string",
                    "maxLength": 63,
                    "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  },
                  "displayName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  },
                  "residency": {
                    "default": "Running",
                    "type": "string",
                    "enum": [
                      "Running",
                      "Suspended",
                      "Archived"
                    ]
                  },
                  "credentialProfile": {
                    "type": "string",
                    "maxLength": 63,
                    "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  },
                  "revision": {
                    "default": "HEAD",
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._/@{}^~+-]*$"
                  },
                  "branch": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
                  },
                  "fetchDepth": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 100000
                  },
                  "pullRequest": {
                    "type": "integer",
                    "minimum": 0,
                    "exclusiveMinimum": true,
                    "maximum": 9007199254740991
                  },
                  "retentionPolicy": {
                    "type": "object",
                    "properties": {
                      "storage": {
                        "type": "string",
                        "enum": [
                          "Retain",
                          "Ephemeral"
                        ]
                      },
                      "ttlAfterArchivedSeconds": {
                        "type": "integer",
                        "minimum": 0,
                        "maximum": 31536000
                      }
                    },
                    "required": [
                      "storage"
                    ]
                  }
                },
                "required": [
                  "projectRef",
                  "displayName",
                  "residency",
                  "credentialProfile",
                  "revision"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "oldSelf.residency != 'Archived' || self.residency == 'Archived'",
                    "message": "Archived workspaces cannot be restored; create a new workspace"
                  },
                  {
                    "rule": "self.projectRef == oldSelf.projectRef",
                    "message": "projectRef is immutable"
                  },
                  {
                    "rule": "(has(self.retentionPolicy) ? self.retentionPolicy.storage : 'Retain') == (has(oldSelf.retentionPolicy) ? oldSelf.retentionPolicy.storage : 'Retain')",
                    "message": "Storage class cannot change after workspace creation"
                  },
                  {
                    "rule": "self.credentialProfile == oldSelf.credentialProfile",
                    "message": "credentialProfile is immutable"
                  },
                  {
                    "rule": "self.revision == oldSelf.revision",
                    "message": "revision is immutable"
                  },
                  {
                    "rule": "has(self.fetchDepth) == has(oldSelf.fetchDepth)",
                    "message": "fetchDepth presence is immutable"
                  },
                  {
                    "rule": "!has(self.fetchDepth) || self.fetchDepth == oldSelf.fetchDepth",
                    "message": "fetchDepth is immutable"
                  },
                  {
                    "rule": "has(self.pullRequest) == has(oldSelf.pullRequest)",
                    "message": "pullRequest presence is immutable"
                  },
                  {
                    "rule": "!has(self.pullRequest) || self.pullRequest == oldSelf.pullRequest",
                    "message": "pullRequest is immutable"
                  },
                  {
                    "rule": "has(self.branch) == has(oldSelf.branch)",
                    "message": "branch presence is immutable"
                  },
                  {
                    "rule": "!has(self.branch) || self.branch == oldSelf.branch",
                    "message": "branch is immutable"
                  }
                ]
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string",
                    "enum": [
                      "Pending",
                      "Ready",
                      "Suspended",
                      "Archived",
                      "Failed"
                    ]
                  },
                  "observedGeneration": {
                    "type": "integer",
                    "minimum": -9007199254740991,
                    "maximum": 9007199254740991
                  },
                  "message": {
                    "type": "string"
                  },
                  "pvcName": {
                    "type": "string"
                  },
                  "archivedAt": {
                    "type": "string"
                  },
                  "teardownCompletedAt": {
                    "type": "string"
                  },
                  "storageDeletedAt": {
                    "type": "string"
                  },
                  "lastFailure": {
                    "type": "object",
                    "properties": {
                      "reason": {
                        "type": "string"
                      },
                      "message": {
                        "type": "string"
                      },
                      "at": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "reason",
                      "message",
                      "at"
                    ]
                  },
                  "backendWorkspaceId": {
                    "type": "string"
                  },
                  "conditions": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "enum": [
                            "Ready"
                          ]
                        },
                        "status": {
                          "type": "string",
                          "enum": [
                            "True",
                            "False"
                          ]
                        },
                        "reason": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        },
                        "observedGeneration": {
                          "type": "number"
                        },
                        "lastTransitionTime": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "observedGeneration",
                        "lastTransitionTime"
                      ]
                    }
                  }
                },
                "required": [
                  "phase",
                  "observedGeneration",
                  "message"
                ]
              }
            },
            "required": [
              "apiVersion",
              "kind",
              "metadata",
              "spec"
            ]
          }
        },
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Project",
            "type": "string",
            "jsonPath": ".spec.projectRef"
          },
          {
            "name": "Residency",
            "type": "string",
            "jsonPath": ".spec.residency"
          },
          {
            "name": "Phase",
            "type": "string",
            "jsonPath": ".status.phase"
          }
        ]
      }
    ]
  }
}
