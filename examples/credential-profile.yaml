apiVersion: paseo-gateway.manziman.github.io/v1alpha1
kind: PaseoCredentialProfile
metadata:
  name: development
  namespace: paseo
spec:
  env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef: {name: provider-keys, key: anthropic}
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef: {name: provider-keys, key: openai}
  files:
    - path: .config/opencode/opencode.json
      valueFrom:
        configMapKeyRef: {name: agent-settings, key: opencode.json}
  git:
    tokenSecretRef: {name: github, key: token}
    identity: {name: Example Developer, email: developer@example.com}
    # Optional SSH transport; provision a verified known_hosts entry first.
    # ssh:
    #   keySecretRef: {name: git-deploy-key, key: id}
    #   knownHostsRef:
    #     configMapKeyRef: {name: git-known-hosts, key: known_hosts}
    # Optional SSH commit/tag signing key (register its public key with GitHub).
    # signing:
    #   format: ssh
    #   keySecretRef: {name: git-signing-key, key: id}
  runtime:
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: '2', memory: 4Gi}
